# Recipe: Kolibri-1
# Aleph Alpha Kolibri-1 (78B total / 3.5B active, block-FP8 MoE) on one DGX Spark
# using the B12X FP8 MoE and linear kernels.
#
# Experimental: the aleph-alpha-inference plugin targets vLLM 0.29.x.
# Cold load takes approximately 20 minutes.
# Recommended sampling: temperature=1.0, top_p=0.97, top_k=128.

recipe_version: "1"
name: Kolibri-1
description: vLLM serving Aleph-Alpha/Kolibri-1 (block-FP8 MoE) on one DGX Spark using B12X FP8 kernels

model: Aleph-Alpha/Kolibri-1
container: vllm-node-b12x

build_args:
  - --exp-b12x

solo_only: true

mods:
  - mods/kolibri-plugin

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.78
  max_model_len: 131072
  max_num_seqs: 4
  max_num_batched_tokens: 8192

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  B12X_MOE_FORCE_A8: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

command: |
  vllm serve Aleph-Alpha/Kolibri-1 \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --kv-cache-dtype fp8 \
      --enable-prefix-caching \
      --moe-backend b12x \
      --linear-backend b12x \
      --reasoning-parser kolibri1 \
      --tool-call-parser kolibri1 \
      --enable-auto-tool-choice
